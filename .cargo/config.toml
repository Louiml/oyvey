# Target-specific hardening flags for the oyvey binary.
#
# These are deliberately the same flags the Rak repository builds rakc and
# rak-setup with. Without this file a plain `cargo build --release` produces an
# oyvey with no CFG, no CET and a weaker ASLR, and nothing in the build would
# report it: the release workflow only fails if something checks the produced
# PE. (It did not, which is how the first published oyvey shipped unhardened
# while the rest of the toolchain was fine.)
#
# Scope note, because it matters for what these flags actually buy:
#
#   /guard:cf   Marks the PE CFG-compatible and initialises the guard dispatch
#               table, with load-time checks. rustc does NOT instrument Rust's
#               own indirect call sites for CFG, so this is not equivalent to
#               Clang's -fsanitize=cfi, which instruments every call site. What
#               it does block is the attack that overwrites the guard dispatch
#               table itself, plus a class of ROP shapes. Treat as partial.
#
#   /CETCOMPAT  Enables Intel CET shadow-stack + indirect-branch tracking, but
#               only for the code the compiler emits the CET instructions for.
#               Also partial.
#
#   /DYNAMICBASE + /HIGHENTROPYVA   ASLR, and 64-bit address space randomization.
#                                  /HIGHENTROPYVA needs /DYNAMICBASE.
#   /NXCOMPAT                      DEP: non-executable stack and heap.
#
# RUSTFLAGS in the environment overrides this file entirely.

# ---------------------------------------------------------------------------
# Windows / MSVC
# ---------------------------------------------------------------------------
[target.x86_64-pc-windows-msvc]
rustflags = [
    # Control Flow Guard: CFG-compatible image + guarded dispatch table.
    "-C", "link-arg=/guard:cf",
    # Control-flow Enforcement Technology: shadow stack, indirect branch tracking.
    "-C", "link-arg=/CETCOMPAT",
    # ASLR, and 64-bit address space randomization.
    "-C", "link-arg=/DYNAMICBASE",
    "-C", "link-arg=/HIGHENTROPYVA",
    # DEP: non-executable stack and heap.
    "-C", "link-arg=/NXCOMPAT",
]

# ---------------------------------------------------------------------------
# Linux / glibc
# ---------------------------------------------------------------------------
[target.x86_64-unknown-linux-gnu]
rustflags = [
    # Full RELRO: the GOT becomes read-only after startup, so a GOT overwrite
    # primitive cannot redirect a later call through it. `-z now` resolves
    # every symbol eagerly, which is what makes the read-only GOT possible.
    "-C", "link-arg=-Wl,-z,relro",
    "-C", "link-arg=-Wl,-z,now",
    # Non-executable stack.
    "-C", "link-arg=-Wl,-z,noexecstack",
    # Keep frame pointers. Costs about 1% and makes any post-mortem walk of a
    # stack possible at all.
    "-C", "force-frame-pointers=yes",
]
